<!DOCTYPE html>
<html>
<head>
  <title>Bilkent Rapor Yoğunluk Haritası</title>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <link rel="stylesheet" href="https://unpkg.com/leaflet@1.7.1/dist/leaflet.css" />
  <script src="https://unpkg.com/leaflet@1.7.1/dist/leaflet.js"></script>
  <style>
    #map { height: 100vh; width: 100vw; }
  </style>
</head>
<body>
<div id="map"></div>

<script>
  const map = L.map('map').setView([39.8678, 32.7494], 17);
  L.tileLayer('https://{s}.tile.openstreetmap.org/{z}/{x}/{y}.png', {
    maxZoom: 19
  }).addTo(map);

  const buildings = __BUILDINGS__; // Replaced by Java later

  const maxReports = Math.max(...buildings.map(b => b.reports), 1); // avoid divide-by-zero

  function getColor(reports) {
    const intensity = reports / maxReports;
    const red = 255;
    const green = Math.round(200 - intensity * 180);
    const blue = Math.round(200 - intensity * 180);
    return `rgb(${red},${green},${blue})`;
  }

  buildings.forEach(b => {
    const baseRadius = 8;
    const maxExtraRadius = 12;
    const radius = baseRadius + (b.reports / maxReports) * maxExtraRadius;

    const circle = L.circleMarker([b.lat, b.lng], {
      radius: radius,
      color: "#000000",
      weight: 1,
      fillColor: getColor(b.reports),
      fillOpacity: 0.7
    }).addTo(map);

    circle.bindPopup(`<b>${b.name}</b><br>${b.reports} rapor`);
  });
</script>

</body>
</html>
